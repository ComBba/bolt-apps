# Generated by: python3 scripts/hero-gallery__app.py --emit-yaml (edit config.json, not this file)
schema_version: 1
runtime: bridge
id: hero-gallery
chip: hero-gallery
title: "Hero gallery"
icon: Image
description: "Pictures drawn by the app itself, shown full width at the top of the preview pane (needs Bolt 182). Offline, no network."
placeholder_examples: ["Press Enter to see the pictures"]
emits: Generic
bridge:
  command:
    macos: "python3 {{scripts_dir}}/hero-gallery__app.py {{scripts_dir}}/hero-gallery__config.json {{scripts_dir}}/hero-gallery__bolt_app_kit.py"
    linux: "python3 {{scripts_dir}}/hero-gallery__app.py {{scripts_dir}}/hero-gallery__config.json {{scripts_dir}}/hero-gallery__bolt_app_kit.py"
  parse: json
  timeout_seconds: 10
presentation:
  widget: list
  title_field: title
  subtitle_field: subtitle
  right_widget:
    kind: entity_preview
    mode: selected_row
    bind:
      hero:
        src: "{{row.img1}}{{row.img2}}{{row.img3}}{{row.img4}}{{row.img5}}{{row.img6}}{{row.img7}}{{row.img8}}{{row.img9}}{{row.img10}}{{row.img11}}{{row.img12}}"
        alt: "{{row.hero_alt}}"
        caption: "{{row.hero_caption}}"
        credit: "{{row.hero_credit}}"
      title: "{{row.title}}"
      subtitle: "{{row.subtitle}}"
      body: "{{row.body}}"
      actions: [copy]
actions:
  - { id: copy, kind: composer, target: row, label: Copy, insert: "{{row.title}}" }
