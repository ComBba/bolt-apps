# Generated by: python3 scripts/cli-wrapper-template__wrap.py --emit-yaml (edit config.json, not this file)
schema_version: 1
runtime: bridge
id: cli-wrapper-template
chip: cli-wrapper-template
title: "Ping check"
icon: network
description: "Type a host name: is it reachable, how fast, how much is lost. Wraps the system ping command, read-only."
placeholder_examples: ["one.one.one.one", "example.com 5"]
emits: Generic
args:
  - { name: view, from: "query.word(0)", default: overview }
  - { name: p1, from: "query.word(1)", default: "-" }
  - { name: p2, from: "query.word(2)", default: "-" }
bridge:
  command:
    macos: "python3 {{scripts_dir}}/cli-wrapper-template__wrap.py {{view}} {{p1}} {{p2}} {{scripts_dir}}/cli-wrapper-template__config.json {{scripts_dir}}/cli-wrapper-template__fixtures.json {{scripts_dir}}/cli-wrapper-template__bolt_app_kit.py"
    linux: "python3 {{scripts_dir}}/cli-wrapper-template__wrap.py {{view}} {{p1}} {{p2}} {{scripts_dir}}/cli-wrapper-template__config.json {{scripts_dir}}/cli-wrapper-template__fixtures.json {{scripts_dir}}/cli-wrapper-template__bolt_app_kit.py"
  parse: json
  timeout_seconds: 20
presentation:
  widget: list
  title_field: title
  subtitle_field: subtitle
  view_arg: view
  right_widget:
    kind: cards
    mode: list_data
    bind:
      layout: "tiles"
      title: "{{row.kpi_label}}"
      value: "{{row.kpi_value}}"
      unit: "{{row.kpi_unit}}"
      max: "{{row.kpi_max}}"
      trend: "{{row.trend}}"
      subtitle: "{{row.kpi_note}}"
      badge: "{{row.kpi_badge}}"
  views:
    overview: {}
    replies:
      right_widget:
        kind: chart
        mode: list_data
        bind:
          type: "line"
          x: "label"
          y: "value"
          label: "Round trip per reply, ms"
    raw:
      right_widget:
        kind: markdown
        mode: selected_row
        bind:
          title: "{{row.title}}"
          body: "{{row.body}}"
    command:
      right_widget:
        kind: markdown
        mode: selected_row
        bind:
          title: "{{row.title}}"
          body: "{{row.body}}"
actions:
  - { id: copy, kind: composer, target: row, label: Copy, insert: "{{row.copy_text}}" }
