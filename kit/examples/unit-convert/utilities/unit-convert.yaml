# Generated by: python3 scripts/app.py --emit-yaml (edit config.json, not this file)
schema_version: 1
runtime: bridge
id: unit-convert
chip: convert
title: "Unit convert"
icon: arrow-left-right
description: "Type an amount, pick two units, get the result with the formula and the same amount in the other units of that kind. Offline, no network."
placeholder_examples: ["Fill the form and press Convert"]
emits: Generic
inputs:
  - { name: "amount", type: "number", label: "Amount", required: true, placeholder: "12.5" }
  - { name: "unit_from", type: "select", label: "From", default: "km", options: ["mm", "cm", "m", "km", "in", "ft", "yd", "mi", "g", "kg", "oz", "lb", "C", "F", "K"] }
  - { name: "unit_to", type: "select", label: "To", default: "mi", options: ["mm", "cm", "m", "km", "in", "ft", "yd", "mi", "g", "kg", "oz", "lb", "C", "F", "K"] }
submit:
  label: "Convert"
bridge:
  command:
    macos: "python3 {{scripts_dir}}/app.py {{amount}} {{unit_from}} {{unit_to}} {{scripts_dir}}/config.json {{scripts_dir}}/bolt_app_kit.py"
    linux: "python3 {{scripts_dir}}/app.py {{amount}} {{unit_from}} {{unit_to}} {{scripts_dir}}/config.json {{scripts_dir}}/bolt_app_kit.py"
  parse: json
  timeout_seconds: 10
presentation:
  widget: list
  title_field: title
  subtitle_field: subtitle
  right_widget:
    kind: detail
    mode: selected_row
    bind:
      title: "{{row.title}}"
      subtitle: "{{row.subtitle}}"
      fields:
        - { label: "Result", value: "{{row.conv_result}}", copy: true }
        - { label: "Formula", value: "{{row.conv_formula}}" }
        - { label: "Reverse", value: "{{row.conv_reverse}}" }
        - { label: "Kind", value: "{{row.conv_kind}}" }
actions:
  - { id: copy, kind: composer, target: row, label: Copy, insert: "{{row.copy_text}}" }
