# Generated by: python3 scripts/file-insights-template__insights.py --emit-yaml (edit config.json, not this file)
schema_version: 1
runtime: bridge
id: file-insights-template
chip: insights
title: "File insights"
icon: line-chart
description: "Type a path to a CSV file: totals, trend, breakdown and what to watch. Read-only, local. No path shows labelled sample data."
placeholder_examples: ["~/Documents/sales.csv", "Enter for sample data"]
emits: Generic
args:
  - { name: view, from: "query.word(0)", default: overview }
  - { name: p1, from: "query.word(1)", default: "-" }
  - { name: p2, from: "query.word(2)", default: "-" }
  - { name: p3, from: "query.word(3)", default: "-" }
bridge:
  command:
    macos: "python3 {{scripts_dir}}/file-insights-template__insights.py {{view}} {{p1}} {{p2}} {{p3}} {{scripts_dir}}/file-insights-template__config.json {{scripts_dir}}/file-insights-template__fixtures.json {{scripts_dir}}/file-insights-template__bolt_app_kit.py"
    linux: "python3 {{scripts_dir}}/file-insights-template__insights.py {{view}} {{p1}} {{p2}} {{p3}} {{scripts_dir}}/file-insights-template__config.json {{scripts_dir}}/file-insights-template__fixtures.json {{scripts_dir}}/file-insights-template__bolt_app_kit.py"
    windows: "python {{scripts_dir}}/file-insights-template__insights.py {{view}} {{p1}} {{p2}} {{p3}} {{scripts_dir}}/file-insights-template__config.json {{scripts_dir}}/file-insights-template__fixtures.json {{scripts_dir}}/file-insights-template__bolt_app_kit.py"
  parse: json
  timeout_seconds: 20
presentation:
  widget: list
  title_field: title
  subtitle_field: subtitle
  view_arg: view
  right_widget:
    kind: cards
    mode: list_data
    bind:
      layout: "tiles"
      title: "{{row.kpi_label}}"
      value: "{{row.kpi_value}}"
      unit: "{{row.kpi_unit}}"
      max: "{{row.kpi_max}}"
      subtitle: "{{row.kpi_note}}"
      badge: "{{row.kpi_badge}}"
  views:
    overview: {}
    trend:
      right_widget:
        kind: chart
        mode: list_data
        bind:
          type: "line"
          x: "label"
          y: "value"
          label: "Total per period"
    breakdown:
      right_widget:
        kind: chart
        mode: list_data
        bind:
          type: "bar"
          x: "label"
          y: "value"
          label: "Total by group, top 10"
    rows:
      right_widget:
        kind: table
        mode: list_data
        bind:
          totals_label: "Total"
          columns:
            - {field: date, label: Date}
            - {field: category, label: Group}
            - {field: value, label: Value, align: right, total: sum}
    problems:
      right_widget:
        kind: markdown
        mode: selected_row
        bind:
          title: "{{row.title}}"
          body: "{{row.body}}"
actions:
  - { id: copy, kind: composer, target: row, label: Copy, insert: "{{row.copy_text}}" }
