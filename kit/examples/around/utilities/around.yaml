# Generated by: python3 scripts/around__around.py --emit-yaml (edit config.json, not this file)
schema_version: 1
runtime: bridge
id: around
chip: around
title: "Around"
icon: map-pin
description: "Type a place: cafes, gyms, live bike docks, the next hours of weather and landmarks nearby, stitched by distance into one verdict."
placeholder_examples: ["Bryant Park, New York", "Enter for the last place"]
emits: Generic
args:
  - { name: view, from: "query.word(0)", default: overview }
  - { name: p1, from: "query.word(1)", default: "-" }
  - { name: p2, from: "query.word(2)", default: "-" }
  - { name: p3, from: "query.word(3)", default: "-" }
  - { name: p4, from: "query.word(4)", default: "-" }
bridge:
  command:
    macos: "python3 {{scripts_dir}}/around__around.py {{view}} {{p1}} {{p2}} {{p3}} {{p4}} {{scripts_dir}}/around__config.json {{scripts_dir}}/around__fixtures.json {{scripts_dir}}/around__bolt_app_kit.py"
    linux: "python3 {{scripts_dir}}/around__around.py {{view}} {{p1}} {{p2}} {{p3}} {{p4}} {{scripts_dir}}/around__config.json {{scripts_dir}}/around__fixtures.json {{scripts_dir}}/around__bolt_app_kit.py"
    windows: "python {{scripts_dir}}/around__around.py {{view}} {{p1}} {{p2}} {{p3}} {{p4}} {{scripts_dir}}/around__config.json {{scripts_dir}}/around__fixtures.json {{scripts_dir}}/around__bolt_app_kit.py"
  parse: json
  timeout_seconds: 25
presentation:
  widget: list
  title_field: title
  subtitle_field: subtitle
  view_arg: view
  right_widget:
    kind: cards
    mode: list_data
    bind:
      layout: "tiles"
      title: "{{row.kpi_label}}"
      value: "{{row.kpi_value}}"
      unit: "{{row.kpi_unit}}"
      max: "{{row.kpi_max}}"
      trend: "{{row.trend}}"
      subtitle: "{{row.kpi_note}}"
      badge: "{{row.kpi_badge}}"
  views:
    overview: {}
    places:
      right_widget:
        kind: detail
        mode: selected_row
        bind:
          title: "{{row.pname}}"
          subtitle: "{{row.chain}}"
          fields:
            - { label: Distance, value: "{{row.dist}}" }
            - { label: Hours, value: "{{row.hours}}" }
            - { label: Nearest dock, value: "{{row.dock}}" }
            - { label: Weather there, value: "{{row.wx}}" }
            - { label: Source, value: "{{row.src}}" }
    bikes:
      right_widget:
        kind: table
        mode: list_data
        bind:
          columns:
            - { field: dock, label: Dock }
            - { field: bikes, label: Bikes, align: right, total: sum }
            - { field: free, label: Free, align: right, total: sum }
            - { field: dist, label: Distance, align: right }
    weather:
      right_widget:
        kind: chart
        mode: list_data
        bind:
          type: "line"
          x: "label"
          y: "value"
          label: "Temperature, next 12 hours, C"
    landmarks:
      right_widget:
        kind: detail
        mode: selected_row
        bind:
          title: "{{row.pname}}"
          fields:
            - { label: Distance, value: "{{row.dist}}" }
            - { label: Source, value: "{{row.src}}" }
    keys:
      right_widget:
        kind: detail
        mode: selected_row
        bind:
          title: "{{row.mode}}"
          fields:
            - { label: State, value: "{{row.state}}" }
            - { label: Sent as, value: "{{row.sample}}" }
            - { label: Sent in, value: "{{row.how}}" }
            - { label: Read from, value: "{{row.where}}" }
actions:
  - { id: open, kind: url, target: row, label: Open in Maps, url_template: "{{row.open_url}}" }
  - { id: copy, kind: composer, target: row, label: Copy address, insert: "{{row.copy_text}}" }
