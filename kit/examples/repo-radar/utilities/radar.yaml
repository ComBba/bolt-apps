# Generated by: python3 scripts/repo-radar__radar.py --emit-yaml (edit config.json, not this file)
schema_version: 1
runtime: bridge
id: repo-radar
chip: radar
title: "Repo radar"
icon: activity
description: "Type owner/repo: one verdict from GitHub, npm, OSV and Hacker News, fetched in parallel. Compare two with: a/b vs c/d."
placeholder_examples: ["expressjs/express", "fastify/fastify vs expressjs/express"]
emits: Generic
args:
  - { name: view, from: "query.word(0)", default: overview }
  - { name: p1, from: "query.word(1)", default: "-" }
  - { name: p2, from: "query.word(2)", default: "-" }
  - { name: p3, from: "query.word(3)", default: "-" }
  - { name: p4, from: "query.word(4)", default: "-" }
bridge:
  command:
    macos: "python3 {{scripts_dir}}/repo-radar__radar.py {{view}} {{p1}} {{p2}} {{p3}} {{p4}} {{scripts_dir}}/repo-radar__config.json {{scripts_dir}}/repo-radar__fixtures.json {{scripts_dir}}/repo-radar__bolt_app_kit.py"
    linux: "python3 {{scripts_dir}}/repo-radar__radar.py {{view}} {{p1}} {{p2}} {{p3}} {{p4}} {{scripts_dir}}/repo-radar__config.json {{scripts_dir}}/repo-radar__fixtures.json {{scripts_dir}}/repo-radar__bolt_app_kit.py"
    windows: "python {{scripts_dir}}/repo-radar__radar.py {{view}} {{p1}} {{p2}} {{p3}} {{p4}} {{scripts_dir}}/repo-radar__config.json {{scripts_dir}}/repo-radar__fixtures.json {{scripts_dir}}/repo-radar__bolt_app_kit.py"
  parse: json
  timeout_seconds: 25
presentation:
  widget: list
  title_field: title
  subtitle_field: subtitle
  view_arg: view
  right_widget:
    kind: cards
    mode: list_data
    bind:
      layout: "tiles"
      title: "{{row.kpi_label}}"
      value: "{{row.kpi_value}}"
      unit: "{{row.kpi_unit}}"
      max: "{{row.kpi_max}}"
      trend: "{{row.trend}}"
      subtitle: "{{row.kpi_note}}"
      badge: "{{row.kpi_badge}}"
  views:
    overview: {}
    releases:
      right_widget:
        kind: diff
        mode: selected_row
        bind:
          left: "{{row.left}}"
          right: "{{row.right}}"
          leftLabel: "earlier"
          rightLabel: "this release"
    since:
      right_widget:
        kind: diff
        mode: selected_row
        bind:
          left: "{{row.left}}"
          right: "{{row.right}}"
          leftLabel: "last look"
          rightLabel: "now"
    vulns:
      right_widget:
        kind: detail
        mode: selected_row
        bind:
          title: "{{row.vid}}"
          subtitle: "{{row.status}}"
          fields:
            - { label: Severity, value: "{{row.sev}}" }
            - { label: Status, value: "{{row.status}}" }
            - { label: Fixed in, value: "{{row.fixed}}" }
            - { label: Published, value: "{{row.published}}" }
            - { label: CVE, value: "{{row.cve}}", copy: true }
    downloads:
      right_widget:
        kind: chart
        mode: list_data
        bind:
          type: "line"
          x: "label"
          y: "value"
          label: "Daily npm downloads, last 30 days"
    discussion:
      right_widget:
        kind: detail
        mode: selected_row
        bind:
          title: "{{row.title}}"
          subtitle: "{{row.posted}}"
          fields:
            - { label: Points, value: "{{row.points}}" }
            - { label: Comments, value: "{{row.comments}}" }
            - { label: Posted, value: "{{row.posted}}" }
    compare:
      right_widget:
        kind: table
        mode: list_data
        bind:
          columns:
            - { field: metric, label: Metric }
            - { field: first, label: First, align: right }
            - { field: second, label: Second, align: right }
            - { field: lead, label: Leads }
actions:
  - { id: open, kind: url, target: row, label: Open, url_template: "{{row.open_url}}" }
  - { id: copy, kind: composer, target: row, label: Copy, insert: "{{row.copy_text}}" }
