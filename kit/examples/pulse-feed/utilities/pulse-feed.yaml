# Generated by: python3 scripts/pulse-feed__app.py --emit-yaml (edit config.json, not this file)
schema_version: 1
runtime: bridge
id: pulse-feed
chip: pulse-feed
title: "Pulse"
icon: trending-up
description: "Trending Hacker News stories, or type a topic word to merge the front page with a search. Tiles, a preview pane per story, Open post, Copy quote and Narrow."
placeholder_examples: ["Enter for trending", "rust", "weekly"]
emits: Generic
args:
  - { name: view, from: "query.word(0)", default: overview }
  - { name: arg, from: "query.word(1)", default: "-" }
bridge:
  command:
    macos: "python3 {{scripts_dir}}/pulse-feed__app.py {{view}} {{arg}} {{scripts_dir}}/pulse-feed__config.json {{scripts_dir}}/pulse-feed__fixtures.json {{scripts_dir}}/pulse-feed__bolt_app_kit.py"
    linux: "python3 {{scripts_dir}}/pulse-feed__app.py {{view}} {{arg}} {{scripts_dir}}/pulse-feed__config.json {{scripts_dir}}/pulse-feed__fixtures.json {{scripts_dir}}/pulse-feed__bolt_app_kit.py"
  parse: json
  timeout_seconds: 20
presentation:
  widget: list
  title_field: title
  subtitle_field: subtitle
  view_arg: view
  right_widget:
    kind: cards
    mode: list_data
    bind:
      layout: "tiles"
      title: "{{row.kpi_label}}"
      value: "{{row.kpi_value}}"
      unit: "{{row.kpi_unit}}"
      subtitle: "{{row.kpi_note}}"
      badge: "{{row.kpi_badge}}"
  views:
    overview: {}
    topic: {}
    stories:
      right_widget:
        kind: entity_preview
        mode: selected_row
        bind:
          title: "{{row.title}}"
          subtitle: "{{row.subtitle}}"
          fields:
            - { label: SOURCE, value: "{{row.story_source}}" }
            - { label: AUTHOR, value: "{{row.story_author}}" }
            - { label: AGE, value: "{{row.story_age}}" }
            - { label: SCORE, value: "{{row.story_score}}" }
          body: "{{row.body}}"
          actions:
            - "open"
            - "copy"
actions:
  - { id: open, kind: url, target: row, label: "Open post", url_template: "{{row.open_url}}" }
  - { id: copy, kind: composer, target: row, label: "Copy quote", insert: "{{row.copy_text}}" }
