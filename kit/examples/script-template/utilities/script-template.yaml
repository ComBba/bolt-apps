# Generated by: python3 scripts/script-template__app.py --emit-yaml (edit config.json, not this file)
schema_version: 1
runtime: bridge
id: script-template
chip: script-template
title: "Script template"
icon: list
description: "A blank script app on the kit: overview, a list with a filter word, a detail view, Back, cache with an old copy, offline row. Replace the API and the fields."
placeholder_examples: ["Enter for the overview", "items", "items alpha"]
emits: Generic
args:
  - { name: view, from: "query.word(0)", default: overview }
  - { name: arg, from: "query.word(1)", default: "-" }
bridge:
  command:
    macos: "python3 {{scripts_dir}}/script-template__app.py {{view}} {{arg}} {{scripts_dir}}/script-template__config.json {{scripts_dir}}/script-template__fixtures.json {{scripts_dir}}/script-template__bolt_app_kit.py"
    linux: "python3 {{scripts_dir}}/script-template__app.py {{view}} {{arg}} {{scripts_dir}}/script-template__config.json {{scripts_dir}}/script-template__fixtures.json {{scripts_dir}}/script-template__bolt_app_kit.py"
  parse: json
  timeout_seconds: 20
presentation:
  widget: list
  title_field: title
  subtitle_field: subtitle
  view_arg: view
  right_widget:
    kind: cards
    mode: list_data
    bind:
      layout: "tiles"
      title: "{{row.kpi_label}}"
      value: "{{row.kpi_value}}"
      unit: "{{row.kpi_unit}}"
      max: "{{row.kpi_max}}"
      subtitle: "{{row.kpi_note}}"
      badge: "{{row.kpi_badge}}"
  views:
    overview: {}
    items:
      right_widget:
        kind: table
        mode: list_data
        bind:
          columns:
            - { field: item_name, label: Name }
            - { field: status, label: Status }
            - { field: count, label: Count, align: right }
    item:
      right_widget:
        kind: detail
        mode: selected_row
        bind:
          title: "{{row.item_name}}"
          subtitle: "{{row.status}}"
          fields:
            - { label: Status, value: "{{row.status}}" }
            - { label: Count, value: "{{row.count}}", copy: true }
actions:
  - { id: copy, kind: composer, target: row, label: Copy, insert: "{{row.copy_text}}" }
